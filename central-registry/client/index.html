<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Client</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; height: 100vh; display: flex; }
        .container { display: flex; width: 100%; height: 100%; }
        .sidebar { width: 280px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #ddd; font-weight: 600; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .refresh-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #666; padding: 4px 8px; border-radius: 4px; }
        .refresh-btn:hover { background: #f0f0f0; color: #333; }
        .user-list { flex: 1; overflow-y: auto; padding: 8px; }
        .user-item { padding: 12px; cursor: pointer; border-radius: 8px; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
        .user-item:hover { background: #f0f0f0; }
        .user-item.active { background: #e3f2fd; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #2196f3; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .user-name { font-weight: 500; }
        .user-status { font-size: 12px; color: #666; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .chat-header { padding: 16px; border-bottom: 1px solid #ddd; font-weight: 600; font-size: 18px; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 70%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
        .message.sent { align-self: flex-end; background: #2196f3; color: white; border-bottom-right-radius: 4px; }
        .message.received { align-self: flex-start; background: #f1f0f0; color: #333; border-bottom-left-radius: 4px; }
        .message.error { align-self: center; background: #ffebee; color: #c62828; font-size: 12px; padding: 6px 12px; border-radius: 12px; }
        .message.system { align-self: center; background: #e8f5e9; color: #2e7d32; font-size: 12px; padding: 6px 12px; border-radius: 12px; }
        .input-area { padding: 16px; border-top: 1px solid #ddd; display: flex; gap: 8px; }
        .input-area input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; }
        .input-area input:focus { border-color: #2196f3; }
        .input-area button { padding: 12px 24px; background: #2196f3; color: white; border: none; border-radius: 24px; font-size: 14px; font-weight: 500; cursor: pointer; }
        .input-area button:hover { background: #1976d2; }
        .input-area button:disabled { background: #90caf9; cursor: not-allowed; }
        .connection-status { padding: 8px 16px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-connected { background: #4caf50; }
        .status-disconnected { background: #f44336; }
        .login-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .login-box { padding: 32px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-box h1 { margin-bottom: 24px; text-align: center; }
        .login-box input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 16px; }
        .login-box button { width: 100%; padding: 14px; background: #2196f3; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>
    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <h1>Central Registry Chat</h1>
            <input type="text" id="username-input" placeholder="Your username" autocomplete="off">
            <button id="login-btn">Connect</button>
            <p style="font-size:12px;color:#999;margin-top:8px;text-align:center;">Your message will be automatically routed to an available server</p>
        </div>
    </div>

    <div id="chat-container" class="container" style="display: none;">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>Users</span>
                <button id="refresh-users-btn" class="refresh-btn" title="Refresh user list">⟳</button>
            </div>
            <div class="connection-status">
                <span id="status-dot" class="status-dot status-disconnected"></span>
                <span id="status-text">Disconnected</span>
            </div>
            <div id="user-list" class="user-list"></div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chat-header">Select a user to chat</div>
            <div id="messages" class="messages"></div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message..." disabled>
                <button id="send-btn" disabled>Send</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
